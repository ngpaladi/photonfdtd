[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "photonfdtd"
version = "0.15.0"
description = "Local-only, differentiable JAX/XLA FDTD + waveguide mode solver for integrated photonics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ngpaladi" }]
keywords = ["fdtd", "photonics", "electromagnetics", "mode-solver", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # The time-stepping engine (CPU wheel by default; install a CUDA/TPU jaxlib,
    # e.g. "jax[cuda12]", for GPU/TPU).
    "jax>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "gdstk"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=3"]
# GDS export of optimized designs; optax optimizers for the design loops.
gds = ["gdstk"]
optim = ["optax"]
# LNOI switch cells for gdsfactory (photonfdtd.lnoi).
gdsfactory = ["gdsfactory>=9"]

[project.urls]
Homepage = "https://github.com/ngpaladi/photonfdtd"
Issues = "https://github.com/ngpaladi/photonfdtd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/photonfdtd"]

[tool.hatch.build.targets.sdist]
include = ["src/photonfdtd", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: end-to-end runs that take longer (deselect with '-m \"not slow\"')",
]
